# Config for the Ruff extension, which tools\setup.ps1 installs on every
# machine. It does two jobs here: it sets the width format-on-save wraps at
# (see the note in .vscode\settings.json), and it carries the one lint
# exemption below. Nothing runs ruff out of .venv -- the extension brings its
# own binary.

# Match .vscode\settings.json's editor.rulers, so the guide in the editor is
# where the formatter actually wraps. Stated rather than relied on: 88 is
# ruff's default today, and a default that moved would move every file.
#
# Top-level ON PURPOSE. A key written after a [table] header belongs to that
# table, so putting this at the bottom would quietly define
# per-file-ignores.line-length and set nothing at all.
line-length = 88

[lint]
ignore = ["PLR1730"]

# lessons\code.py imports a lesson for its side effect -- the import IS the
# program. F401 "imported but unused" is wrong there, and it is worse than
# noise: `ruff --fix`, or the extension's fix-on-save, would delete the only
# functional line in the launcher and leave the board running nothing.
[lint.per-file-ignores]
"lessons/code.py" = ["F401"]

